name: fjordbudget
services:
  app:
    build: .
    ports:
      - "127.0.0.1:8060:8080"
    environment:
      APP_URL: http://localhost:8060
      ENABLE_BANKING_APP_ID: ${ENABLE_BANKING_APP_ID:-}
      ENABLE_BANKING_KEY_FILE: /run/secrets/enablebanking.pem
      TZ: Europe/Copenhagen
    volumes:
      - budget_data:/data
      - ./secrets:/run/secrets:ro
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
volumes:
  budget_data:
